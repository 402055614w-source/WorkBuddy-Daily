name: 🐕 Watchdog

on:
  schedule:
    - cron: "10 16 * * *"   # 北京时间 00:10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检查两个签到仓库
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python3 - <<'PY'
          import os, json, datetime, urllib.request, urllib.parse

          PAT = os.environ.get("GH_PAT", "").strip()
          SK = os.environ.get("SENDKEY", "").strip()
          OWNER = "402055614w-source"
          REPOS = {
              "WorkBuddy-Daily-Actions": "国内版(2账号)",
              "WorkBuddy-Daily-Private": "国际版(1账号)",
          }
          WINDOW_HOURS = 30
          problems = []

          def api(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + PAT,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "wb-watchdog",
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          now = datetime.datetime.now(datetime.timezone.utc)

          if not PAT:
              problems.append("GH_PAT 未配置，无法检查签到状态")

          for repo, label in REPOS.items():
              if not PAT:
                  break
              try:
                  data = api("https://api.github.com/repos/%s/%s/actions/runs?per_page=15" % (OWNER, repo))
                  runs = [r for r in data.get("workflow_runs", []) if not r.get("name", "").startswith("🐕")]
              except Exception as err:
                  problems.append("%s %s：查询失败（%s）" % (label, repo, str(err)[:80]))
                  continue

              if not runs:
                  problems.append("%s %s：没有任何运行记录" % (label, repo))
                  continue

              recent_ok = None
              for r in runs:
                  try:
                      created = datetime.datetime.fromisoformat(r["created_at"].replace("Z", "+00:00"))
                  except Exception:
                      continue
                  if (now - created).total_seconds() <= WINDOW_HOURS * 3600 and r.get("conclusion") == "success":
                      recent_ok = r
                      break

              last = runs[0]
              if recent_ok is None:
                  problems.append("%s %s：%d 小时内没有成功签到（最近一次 %s，%s）" % (
                      label, repo, WINDOW_HOURS, last.get("conclusion") or last.get("status"), last.get("created_at")))
              else:
                  hours = (now - datetime.datetime.fromisoformat(
                      recent_ok["created_at"].replace("Z", "+00:00"))).total_seconds() / 3600
                  print("OK %s：最近成功 %.1f 小时前 (%s)" % (repo, hours, recent_ok["id"]))

          if problems:
              title = "⚠️ 签到异常 %d 项" % len(problems)
              body = "检查时间：%s\n\n" % now.astimezone().strftime("%Y-%m-%d %H:%M")
              body += "\n".join("- " + p for p in problems)
              body += "\n\n处理建议：打开对应仓库 Actions 页面手动 Run workflow 一次；若是令牌失效，需要重新登录获取新令牌。"
              print("PROBLEM:\n" + body)
              if SK:
                  try:
                      payload = urllib.parse.urlencode({"title": title[:32], "desp": body}).encode()
                      req = urllib.request.Request("https://sctapi.ftqq.com/%s.send" % SK, data=payload)
                      with urllib.request.urlopen(req, timeout=20) as resp:
                          print("Server酱:", resp.read().decode("utf-8", "replace")[:200])
                  except Exception as err:
                      print("Server酱推送失败:", err)
          else:
              print("全部正常，不发通知")

          import sys
          sys.exit(0)
          PY

      - name: 心跳提交（防止 60 天无活动被 GitHub 停用）
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .watchdog_heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .watchdog_heartbeat
          if git diff --cached --quiet; then
            echo "心跳无变化"
          else
            git commit -m "chore: watchdog heartbeat [skip ci]"
            git push || echo "push 失败（不影响检查结果）"
          fi
