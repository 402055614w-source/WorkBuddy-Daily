name: 📊 Token Health

on:
  schedule:
    - cron: "0 1 1 * *"   # 每月 1 号 北京时间 09:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 生成令牌健康月报
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python3 - <<'PY'
          import os, json, base64, datetime, urllib.request, urllib.parse

          PAT = os.environ.get("GH_PAT", "").strip()
          SK = os.environ.get("SENDKEY", "").strip()
          OWNER = "402055614w-source"
          SOURCES = [
              ("国内版", "WorkBuddy-Daily-Actions", "wb_refresh_tokens.json"),
              ("国际版", "WorkBuddy-Daily-Private", "wb_intl_tokens.json"),
          ]

          def api(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + PAT,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "wb-token-health",
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          def jwt_payload(tok):
              try:
                  part = tok.split(".")[1]
                  part += "=" * (-len(part) % 4)
                  return json.loads(base64.urlsafe_b64decode(part))
              except Exception:
                  return {}

          now = datetime.datetime.now(datetime.timezone.utc)
          month_start = now - datetime.timedelta(days=30)
          out = []
          urgent = 0
          warn = 0

          for label, repo, path in SOURCES:
              out.append("【%s】" % label)

              # 令牌到期
              try:
                  d = api("https://api.github.com/repos/%s/%s/contents/%s" % (OWNER, repo, path))
                  store = json.loads(base64.b64decode(d["content"]).decode("utf-8", "replace"))
              except Exception as err:
                  out.append("  ⚠️ 令牌池读取失败：%s" % str(err)[:60])
                  store = {}

              if not store:
                  out.append("  （无账号数据）")
              for key, v in store.items():
                  v = v or {}
                  rt = v.get("refresh_token") or ""
                  p = jwt_payload(rt)
                  at_p = jwt_payload(v.get("access_token") or "")
                  name = (at_p.get("preferred_username") or at_p.get("email")
                          or p.get("preferred_username") or p.get("email")
                          or p.get("phone_number") or p.get("phone") or key)
                  exp = p.get("exp") or at_p.get("exp")
                  if not exp:
                      out.append("  · %s：无法解析到期时间" % name)
                      continue
                  exp_dt = datetime.datetime.fromtimestamp(exp, datetime.timezone.utc)
                  left = (exp_dt - now).days
                  if left <= 7:
                      flag = "🔴 紧急"
                      urgent += 1
                  elif left <= 15:
                      flag = "⚠️ 注意"
                      warn += 1
                  else:
                      flag = "✅"
                  out.append("  · %s  到期 %s  剩 %d 天  %s" % (
                      name, exp_dt.astimezone().strftime("%Y-%m-%d"), left, flag))

              # 近 30 天签到成功率
              try:
                  since = month_start.strftime("%Y-%m-%dT%H:%M:%SZ")
                  qs = urllib.parse.quote(">=" + since)
                  runs = api("https://api.github.com/repos/%s/%s/actions/runs?per_page=100&created=%s"
                             % (OWNER, repo, qs)).get("workflow_runs", [])
                  runs = [r for r in runs if not r.get("name", "").startswith(("🐕", "📊"))]
                  total = len(runs)
                  ok = sum(1 for r in runs if r.get("conclusion") == "success")
                  bad = sum(1 for r in runs if r.get("conclusion") not in ("success", "skipped", None))
                  if total:
                      rate = ok * 100.0 / total
                      mark = "✅" if rate >= 90 else ("⚠️" if rate >= 70 else "🔴")
                      out.append("  近30天运行 %d 次，成功 %d 次（%.0f%%）%s%s" % (
                          total, ok, rate, mark, ("，失败 %d 次" % bad) if bad else ""))
                  else:
                      out.append("  近30天无运行记录 ⚠️")
              except Exception as err:
                  out.append("  运行统计读取失败：%s" % str(err)[:60])

          head = "📊 令牌健康月报 %s" % now.astimezone().strftime("%Y-%m-%d")
          body = head + "\n\n" + "\n".join(out)
          body += "\n\n说明：refresh_token 每次签到都会自动续期，正常情况剩余天数会一直保持在 20 天以上。"
          if urgent or warn:
              body += "\n⚠️ 有 %d 个令牌即将到期，说明近期续期可能中断，建议检查签到运行记录。" % (urgent + warn)
          body += "\n（本消息由看门狗每月 1 号自动发送）"

          print(body)
          if SK:
              try:
                  payload = urllib.parse.urlencode({"title": head[:32], "desp": body}).encode()
                  req = urllib.request.Request("https://sctapi.ftqq.com/%s.send" % SK, data=payload)
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      print("Server酱:", resp.read().decode("utf-8", "replace")[:200])
              except Exception as err:
                  print("Server酱推送失败:", err)
          PY
